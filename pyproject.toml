[project]
name = "renderknecht"
authors = [
  { name="Rainer Poisel", email="rainer@honeytreelabs.com" },
]
version = "0.1.0"
description = "PDF renderer based on pandoc, the eisvogel template and other components"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "pandoc", "pdf", "latex", "cli"]
requires-python = ">=3.12"
classifiers = [
    'Development Status :: 4 - Beta',
    'Framework :: Pytest',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Operating System :: POSIX :: Linux',
]
dependencies = []

[project.optional-dependencies]
container = [
    "flask>=3.1.0",
    "graphviz>=0.20.3",
    "httpx>=0.28.0",
    "pandoc-latex-environment>=1.2.1.0",
    "pyyaml>=6.0.2",
]

[project.urls]
"Homepage" = "https://honeytreelabs.com"
"Documentation" = "https://github.com/Embedded-Focus/renderknecht#readme"
"Repository" = "https://github.com/Embedded-Focus/renderknecht"
"Issues" = "https://github.com/Embedded-Focus/renderknecht/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
renderknecht = "renderknecht.cli:main"
renderknecht-render = "renderknecht.renderer_cli:main"
renderknecht-wrapper = "renderknecht.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renderknecht"]
artifacts = ["src/renderknecht/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "*Test *_test"
addopts = "--strict-markers"

markers = []

log_cli = true
log_cli_level = "INFO"

[tool.uv]
preview-features = [
    "audit-command",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]
extend-safe-fixes = ["I"]

# First iteration just enable a common set
select = [
    #"ALL",
    # pycodestyle
    "E",
    # pydocstyle
    #"D",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flage8-annotations
    "ANN",
    # flake8-bugbear
    "B",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # naming conventions
    "N",
]
ignore = [
    # line-too-long (E501)#
    # https://docs.astral.sh/ruff/rules/line-too-long/
    "E501",
    # Checks for packages that are missing an __init__.py file.
    # https://docs.astral.sh/ruff/rules/implicit-namespace-package/
    "INP001",
    # Checks for undocumented public module definitions.
    # https://docs.astral.sh/ruff/rules/undocumented-public-module
    "D100",
    # bad-quotes-inline-string (Q000)#
    # https://docs.astral.sh/ruff/rules/bad-quotes-inline-string/
    "Q000",
    # too-many-arguments (PLR0913)
    # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "PLR0913",
    # assert (S101)#
    # https://docs.astral.sh/ruff/rules/assert/
    # Reason: pytest uses assertions
    "S101",
    # subprocess-without-shell-equals-true (S603
    # https://docs.astral.sh/ruff/rules/subprocess-without-shell-equals-true/
    # Reason: Conflicts with S602 and using inside test
    "S603",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "build>=1.4.0",
    "flask>=3.1.0",
    "graphviz>=0.20.3",
    "httpx>=0.28.0",
    "pandoc-latex-environment>=1.2.1.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.2",
    "ruff>=0.15.1",
    "twine>=6.2.0",
    "ty>=0.0.17",
]

[tool.ruff.lint.flake8-pytest-style]
# Ignore missing '()' at marker without args.
# https://docs.astral.sh/ruff/settings/#lint_flake8-pytest-style_mark-parentheses
mark-parentheses = false
