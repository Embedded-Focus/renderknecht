# `landscapepage` puts a wide table on its own landscape sheet. A document
# marks it with `::: landscapepage` and needs nothing else. The driver wraps
# the definition in a check. If the definition already exists, the driver
# skips it. A preamble file often already carries the definition, so this
# is the normal case. Two definitions in one build stop it with an error.
#
# `pdflscape` rotates the sheet for the viewer. It never touches the head
# and foot that `scrlayer-scrpage` draws for Eisvogel. That head and foot
# stay in portrait layer geometry, so they turn sideways with the rest of
# the page.
#
# `\pagestyle{empty}` turns off this head and foot. `\@oddhead` and
# `\@oddfoot` then draw a replacement. LaTeX draws this replacement once per
# page, the same way it draws the original head and foot. This also covers
# tables that run across several landscape sheets. With `eso-pic`, a
# `\AddToShipoutPictureBG` background drops off the last page of a
# multi-page `landscape` block instead. This is a real conflict between
# `eso-pic` and `pdflscape`, not a timing bug worth working around.
#
# The replacement uses TikZ absolute page coordinates and `\rotatebox{90}`
# for position. It matches title, date, author, and page number to what
# Eisvogel shows on a portrait page, with the same head and foot rule.
#
# `lscape` places the body box starting at `1in+\oddsidemargin` from the
# physical edge, the same offset, about 2.5cm, where the head bar above
# sits. The body box also extends close to where the foot bar sits.
# Shrinking only `\textheight` moves the far end away from the foot but
# leaves the start exactly where the head is. A test with a table long
# enough to fill a sheet showed this problem. The foot had a real gap. The
# head had only a small, incidental gap, by luck and not by design.
#
# `\oddsidemargin` is pushed out by 2cm to move the start away from the
# head. `\textheight` (with the `\@colht`/`\@colroom`/`\vsize` copies
# `landscape` makes of it) is shrunk by 4cm: 2cm for the same shift at the
# start, and 2cm for the foot, as before.
#
# Eisvogel sets every figure to `[H]` placement. A `[H]` figure never
# floats to a later page, but it must still fit on the current page.
#
# Pandoc already helps with this. For any `\includegraphics` call with a
# `width` but no `height`, pandoc adds `height=\textheight,keepaspectratio`.
# A tall image then shrinks to fit `\textheight`.
#
# This shrink target was the same `\textheight` value just copied into
# `\@colht`, `\@colroom`, and `\vsize`. It left no room for the caption
# below the image. A `[H]` figure often sits alone on a landscape sheet,
# with no other text. When the image alone already fills the full budget,
# the caption does not fit. LaTeX then starts the figure on a fresh page,
# and the page meant for it ships empty.
#
# A test confirmed this cause. Plain paragraphs on the same sheet, with no
# figure, never lost a sheet. A figure, placed between two such
# paragraphs, split the content onto three sheets. One sheet was blank,
# one held the image, and one held the text after it.
#
# The code now shrinks `\textheight` by a further 2cm, after the copy to
# `\@colht`, `\@colroom`, and `\vsize`. Pandoc's own image-fitting then
# leaves that much room for the caption. The code does not touch the 2cm
# page budget in `\@colht`, `\@colroom`, and `\vsize`, so a table still
# gets the same capacity as before.
- |
  ```{=latex}
  \usepackage{tikz}
  \makeatletter
  \@ifundefined{landscapepage}{%
  \newcommand{\landscapepage@head}{%
  \begin{tikzpicture}[remember picture,overlay]
  \node[rotate=90,anchor=south west,inner sep=0pt] at ([xshift=2.5cm,yshift=2.5cm]current page.south west)
  {\hbox to \dimexpr\paperheight-5cm\relax{\normalfont\upshape\small \@title\hfil \@date}};
  \node[rotate=90,anchor=south west,inner sep=0pt] at ([xshift=2.6cm,yshift=2.5cm]current page.south west)
  {\hbox to \dimexpr\paperheight-5cm\relax{\leaders\hrule height 0.4pt\hfil}};
  \end{tikzpicture}%
  }%
  \newcommand{\landscapepage@foot}{%
  \begin{tikzpicture}[remember picture,overlay]
  \node[rotate=90,anchor=north west,inner sep=0pt] at ([xshift=\dimexpr\paperwidth-2.6cm\relax,yshift=2.5cm]current page.south west)
  {\hbox to \dimexpr\paperheight-5cm\relax{\leaders\hrule height 0.4pt\hfil}};
  \node[rotate=90,anchor=north west,inner sep=0pt] at ([xshift=\dimexpr\paperwidth-2.5cm\relax,yshift=2.5cm]current page.south west)
  {\hbox to \dimexpr\paperheight-5cm\relax{\normalfont\upshape\small \@author\hfil \thepage}};
  \end{tikzpicture}%
  }%
  \newenvironment{landscapepage}{%
  \clearpage
  \pagestyle{empty}%
  \blandscape
  \addtolength{\oddsidemargin}{2cm}%
  \addtolength{\textheight}{-4cm}%
  \@colht=\textheight\relax
  \@colroom=\textheight\relax
  \vsize=\textheight\relax
  \addtolength{\textheight}{-2cm}%
  \def\@oddhead{\landscapepage@head}%
  \def\@oddfoot{\landscapepage@foot}%
  }{%
  \elandscape
  \clearpage
  \@ifundefined{ps@eisvogel-header-footer}{}{\pagestyle{eisvogel-header-footer}}%
  }
  }{}
  \makeatother
  ```
# The sheet environments put a wide diagram or a wide table on a sheet of
# another size. A document marks one with `::: a3page`, `::: a4page`, and the
# rest of the family, and needs nothing else. The driver owns this definition
# and wraps it in a check. If a definition already exists, the driver skips
# it. Two definitions in one build stop it with an error.
#
# This block is a verbatim copy of SHEET_PAGE_INCLUDE from
# renderers/pandoc.py, generated by `_sheet_page_include` for the whole
# family. A test compares both texts. If you change one, change the other.
#
# The paper change lives in three helpers shared by every size: one that
# captures the base paper and layout, and one each for switching and
# restoring. `\KOMAoptions{paper=<spec>}` sets the new `\paperwidth` and
# `\paperheight`. The option accepts a name such as `a3`, and a pair such
# as `297mm:420mm`. The code never recalculates the type area for a sheet:
# typearea caps the line width to the font size, so an A3 sheet would end up
# with a narrow strip of text instead of a full page, and the page after the
# sheet would lose the layout that the geometry package built for Eisvogel.
# The code grows the type area with the paper, keeps the margins, and writes
# the captured lengths back at the end.
#
# Every layout write is global. The sheet's last page ships out inside the
# environment group, and the LaTeX output routine then writes `\@colht` and
# `\vsize` globally from the sheet's `\textheight`. With local writes, those
# two would survive the group end, and the page after the sheet would carry
# its foot below the paper edge. The restore runs after that last shipout
# and overwrites the whole layout.
#
# KOMA-Script writes `\pdfpagewidth` and `\pdfpageheight` once, at
# `\begin{document}`. A later `paper` change does not reach the PDF page
# size on its own, so the code writes both primitives after every paper
# change. Each write is guarded, because the primitive name differs between
# engines.
#
# Every sheet captures the paper and the layout it starts from, as dimensions
# and not as a name. `paper=210mm:297mm` is a valid `paper` value. The capture
# registers are local to the environment group, so nested sheets restore
# level by level: an inner sheet gives the outer sheet its layout back, and
# the outer sheet gives the document its own. A document that sets
# `papersize:` in its front matter gets its own paper back.
#
# The Eisvogel head and foot need no replacement here. `scrlayer` stores the
# geometry of every layer as an expression, and evaluates the expression once
# per page, at shipout. The layers hold `\textwidth` and `\paperwidth`, so
# they follow the new paper on the next sheet.
#
# KOMA-Script warns when a type area option changes inside a group, and an
# environment is a group. The code silences the warning around the `\KOMAoptions` calls and
# restores the check right after. The helpers use `\providecommand`, so a
# preamble that defines them first wins.
#
# Each environment carries its own `\@ifundefined` guard. A document that
# defines one size itself keeps its copy, and the family fills in the rest.
- |
  ```{=latex}
  \makeatletter
  \@ifundefined{renderknecht@switchpaper}{%
  \newdimen\renderknecht@base@paperwidth
  \newdimen\renderknecht@base@paperheight
  \newdimen\renderknecht@base@textwidth
  \newdimen\renderknecht@base@textheight
  \newdimen\renderknecht@base@oddsidemargin
  \newdimen\renderknecht@base@topmargin
  \newdimen\renderknecht@base@headheight
  \newdimen\renderknecht@base@headsep
  \newdimen\renderknecht@base@footskip
  \providecommand*{\renderknecht@silencegroupleveltest}{%
  \@ifundefined{scr@grouplevel@test}{}{%
  \let\renderknecht@saved@groupleveltest\scr@grouplevel@test
  \let\scr@grouplevel@test\@gobble
  }%
  }%
  \providecommand*{\renderknecht@restategroupleveltest}{%
  \@ifundefined{renderknecht@saved@groupleveltest}{}{%
  \let\scr@grouplevel@test\renderknecht@saved@groupleveltest
  }%
  }%
  \newcommand{\renderknecht@capturelayout}{%
  \renderknecht@base@paperwidth=\paperwidth
  \renderknecht@base@paperheight=\paperheight
  \renderknecht@base@textwidth=\textwidth
  \renderknecht@base@textheight=\textheight
  \renderknecht@base@oddsidemargin=\oddsidemargin
  \renderknecht@base@topmargin=\topmargin
  \renderknecht@base@headheight=\headheight
  \renderknecht@base@headsep=\headsep
  \renderknecht@base@footskip=\footskip
  }%
  \newcommand{\renderknecht@switchpaper}[1]{%
  \renderknecht@silencegroupleveltest
  \KOMAoptions{paper=#1}%
  \renderknecht@restategroupleveltest
  \global\paperwidth=\paperwidth
  \global\paperheight=\paperheight
  \global\textwidth=\dimexpr\renderknecht@base@textwidth+\paperwidth-\renderknecht@base@paperwidth\relax
  \global\textheight=\dimexpr\renderknecht@base@textheight+\paperheight-\renderknecht@base@paperheight\relax
  \global\oddsidemargin=\renderknecht@base@oddsidemargin
  \global\topmargin=\renderknecht@base@topmargin
  \global\headheight=\renderknecht@base@headheight
  \global\headsep=\renderknecht@base@headsep
  \global\footskip=\renderknecht@base@footskip
  \global\hsize=\textwidth
  \global\linewidth=\textwidth
  \global\@colht=\textheight
  \global\@colroom=\textheight
  \global\vsize=\textheight
  \ifdefined\pdfpagewidth\global\pdfpagewidth=\paperwidth\fi
  \ifdefined\pdfpageheight\global\pdfpageheight=\paperheight\fi
  }%
  \newcommand{\renderknecht@restorepaper}{%
  \global\paperwidth=\renderknecht@base@paperwidth
  \global\paperheight=\renderknecht@base@paperheight
  \global\textwidth=\renderknecht@base@textwidth
  \global\textheight=\renderknecht@base@textheight
  \global\oddsidemargin=\renderknecht@base@oddsidemargin
  \global\topmargin=\renderknecht@base@topmargin
  \global\headheight=\renderknecht@base@headheight
  \global\headsep=\renderknecht@base@headsep
  \global\footskip=\renderknecht@base@footskip
  \global\hsize=\textwidth
  \global\linewidth=\textwidth
  \global\@colht=\textheight
  \global\@colroom=\textheight
  \global\vsize=\textheight
  \ifdefined\pdfpagewidth\global\pdfpagewidth=\paperwidth\fi
  \ifdefined\pdfpageheight\global\pdfpageheight=\paperheight\fi
  }%
  }{}
  \@ifundefined{a3page}{%
  \newenvironment{a3page}{%
  \clearpage
  \renderknecht@capturelayout
  \renderknecht@switchpaper{a3}%
  }{%
  \clearpage
  \renderknecht@restorepaper
  }
  }{}
  \@ifundefined{a4page}{%
  \newenvironment{a4page}{%
  \clearpage
  \renderknecht@capturelayout
  \renderknecht@switchpaper{a4}%
  }{%
  \clearpage
  \renderknecht@restorepaper
  }
  }{}
  \@ifundefined{a5page}{%
  \newenvironment{a5page}{%
  \clearpage
  \renderknecht@capturelayout
  \renderknecht@switchpaper{a5}%
  }{%
  \clearpage
  \renderknecht@restorepaper
  }
  }{}
  \@ifundefined{b5page}{%
  \newenvironment{b5page}{%
  \clearpage
  \renderknecht@capturelayout
  \renderknecht@switchpaper{b5}%
  }{%
  \clearpage
  \renderknecht@restorepaper
  }
  }{}
  \@ifundefined{letterpage}{%
  \newenvironment{letterpage}{%
  \clearpage
  \renderknecht@capturelayout
  \renderknecht@switchpaper{letter}%
  }{%
  \clearpage
  \renderknecht@restorepaper
  }
  }{}
  \makeatother
  ```
# Eisvogel loads Source Code Pro only when no font family is set. We set one above,
# so it does not. The driver adds the `sourcecodepro` include to header-includes on
# every render. See CODE_FONT_INCLUDE in renderers/pandoc.py.
pandoc-latex-environment:
  tcolorbox: [box]
  info-box: [info]
  warning-box: [warning]
  error-box: [error]
  landscapepage: [landscapepage]
  a3page: [a3page]
  a4page: [a4page]
  a5page: [a5page]
  b5page: [b5page]
  letterpage: [letterpage]
